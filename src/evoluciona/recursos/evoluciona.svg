<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de Evoluciona: dos momentos de la misma figura alineados y el deslizador de comparación -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173f63"/>
      <stop offset="1" stop-color="#14808a"/>
    </linearGradient>
    <linearGradient id="antes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfeaf2"/>
      <stop offset="1" stop-color="#c9dbe6"/>
    </linearGradient>
    <linearGradient id="despues" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe7c2"/>
      <stop offset="1" stop-color="#f3cf8e"/>
    </linearGradient>
    <clipPath id="foto">
      <rect x="40" y="58" width="176" height="148" rx="14"/>
    </clipPath>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#fondo)"/>

  <!-- fotos anteriores de la serie -->
  <rect x="58" y="34" width="176" height="148" rx="14" fill="#ffffff" opacity="0.18"/>
  <rect x="49" y="46" width="176" height="148" rx="14" fill="#ffffff" opacity="0.30"/>

  <!-- foto actual: antes (izquierda) y después (derecha) -->
  <g clip-path="url(#foto)">
    <rect x="40" y="58" width="88" height="148" fill="url(#antes)"/>
    <rect x="128" y="58" width="88" height="148" fill="url(#despues)"/>
    <rect x="40" y="178" width="176" height="28" fill="#7a5a3c"/>

    <!-- planta pequeña (antes) -->
    <path d="M84 178 C84 164 83 156 84 144" stroke="#2f8f46" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M83 160 C71 159 63 151 61 141 C73 141 82 148 83 160 Z" fill="#43a85a"/>
    <path d="M84 152 C95 147 103 139 103 128 C92 130 85 139 84 152 Z" fill="#43a85a"/>
    <!-- planta grande (después) -->
    <path d="M172 178 C170 150 176 120 172 84" stroke="#257a3a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M172 154 C150 154 140 142 136 124 C156 122 169 134 172 154 Z" fill="#3a9a50"/>
    <path d="M173 132 C192 128 204 114 206 96 C186 98 174 112 173 132 Z" fill="#3a9a50"/>
    <path d="M172 104 C160 96 155 84 156 72 C168 76 174 90 172 104 Z" fill="#4cb565"/>
  </g>
  <rect x="40" y="58" width="176" height="148" rx="14" fill="none" stroke="#ffffff" stroke-width="4"/>

  <!-- deslizador de comparación -->
  <rect x="125" y="50" width="6" height="164" rx="3" fill="#ffffff"/>
  <circle cx="128" cy="132" r="17" fill="#ffffff"/>
  <path d="M121 125 L113 132 L121 139 Z M135 125 L143 132 L135 139 Z" fill="#173f63"/>
</svg>
